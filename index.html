<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaCreative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #5b6ef5;
  --accent-light: #eef0fe;
  --accent-dark: #4655d4;
  --sidebar-bg: #0f1117;
  --sidebar-w: 220px;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --border: #e8eaef;
  --text: #111827;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --green: #10b981; --green-bg: #ecfdf5;
  --yellow: #f59e0b; --yellow-bg: #fffbeb;
  --red: #ef4444;   --red-bg: #fef2f2;
  --blue: #3b82f6;  --blue-bg: #eff6ff;
  --purple: #8b5cf6;--purple-bg: #f5f3ff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  --font: 'Inter', -apple-system, sans-serif;
  --transition: 0.18s cubic-bezier(.4,0,.2,1);
}
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--surface-2);
  color: var(--text);
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── Sidebar ───────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform var(--transition);
}
.sidebar-logo {
  padding: 20px 16px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-text { color: white; font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
.logo-sub { color: rgba(255,255,255,.35); font-size: 10px; font-weight: 500; margin-top: 1px; }

.sidebar-section { padding: 16px 8px 0; flex: 1; overflow-y: auto; }
.sidebar-label { color: rgba(255,255,255,.28); font-size: 10px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; padding: 0 8px 8px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: rgba(255,255,255,.55);
  font-size: 13px;
  font-weight: 500;
  transition: all var(--transition);
  margin-bottom: 2px;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.85); }
.nav-item.active { background: rgba(91,110,245,.22); color: white; }
.nav-item.active .nav-icon { color: var(--accent); }
.nav-icon { width: 18px; text-align: center; font-size: 16px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  background: rgba(91,110,245,.35);
  color: #a5adff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}
.sidebar-footer {
  padding: 12px 8px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.sidebar-footer .nav-item { color: rgba(255,255,255,.35); font-size: 12px; }

/* ─── Main ──────────────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 60px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-title { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.page-content { padding: 28px; max-width: 1100px; flex: 1; }

/* ─── Panels ────────────────────────────────────────────── */
.panel { display: none; animation: fadeUp .2s ease; }
.panel.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Card ──────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .ct-icon {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  background: var(--accent-light);
}

/* ─── Form ──────────────────────────────────────────────── */
.field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.required-dot { color: var(--red); font-size: 14px; line-height: 1; }
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 6px 14px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-2);
  transition: all var(--transition);
  user-select: none;
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.chip.selected { border-color: var(--accent); background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(91,110,245,.35); }

.fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px; }
.field-block { display: flex; flex-direction: column; }

/* ─── Name Preview ──────────────────────────────────────── */
.name-preview-wrap {
  background: linear-gradient(135deg, #f0f1ff 0%, #f7f8fc 100%);
  border: 1.5px solid #dde0fc;
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
}
.name-preview-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--accent);
  margin-bottom: 10px;
}
.name-tokens { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 32px; }
.name-token {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Courier New', monospace;
}
.name-sep { color: var(--text-3); font-size: 14px; font-family: monospace; font-weight: 700; }
.name-placeholder { color: var(--text-3); font-size: 13px; font-style: italic; }
.token-colors { }

/* ─── Bottom bar ────────────────────────────────────────── */
.form-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.form-footer-right { display: flex; gap: 8px; align-items: center; }

/* ─── Inputs ────────────────────────────────────────────── */
input[type=text], select, textarea {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: var(--surface);
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}
input[type=text]:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(91,110,245,.12);
}

/* ─── Buttons ───────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 2px 8px rgba(91,110,245,.35);
}
.btn-primary:hover { background: var(--accent-dark); box-shadow: 0 4px 14px rgba(91,110,245,.45); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: #d1d5db; }
.btn-danger-ghost { background: transparent; color: var(--red); border: 1.5px solid #fecaca; }
.btn-danger-ghost:hover { background: var(--red-bg); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 8px; font-size: 11px; border-radius: 6px; }
.btn-icon-only {
  padding: 8px;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}
.btn-icon-only:hover { background: var(--surface); box-shadow: var(--shadow); }

/* ─── Status badge ──────────────────────────────────────── */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px 3px 7px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
}
.status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.s-draft   { background: #f3f4f6; color: #6b7280; } .s-draft::before { background: #9ca3af; }
.s-review  { background: var(--yellow-bg); color: #92400e; } .s-review::before { background: var(--yellow); }
.s-approved{ background: var(--green-bg); color: #065f46; } .s-approved::before { background: var(--green); }
.s-active  { background: var(--blue-bg); color: #1e40af; } .s-active::before { background: var(--blue); animation: pulse 1.5s infinite; }
.s-paused  { background: var(--red-bg); color: #991b1b; } .s-paused::before { background: var(--red); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ─── Search & Filters ──────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-icon {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  font-size: 14px;
  pointer-events: none;
}
.search-wrap input {
  padding-left: 34px;
}
.filter-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-2);
  transition: all var(--transition);
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

/* ─── Creative Cards ────────────────────────────────────── */
.cr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.cr-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.cr-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--transition);
}
.cr-card:hover { border-color: #c7cef7; box-shadow: var(--shadow); transform: translateY(-2px); }
.cr-card:hover::before { transform: scaleX(1); }
.cr-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cr-name {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  word-break: break-all;
  line-height: 1.5;
}
.cr-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.cr-tag {
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 600;
  background: var(--surface-2);
  color: var(--text-2);
}
.cr-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.cr-date { font-size: 11px; color: var(--text-3); }

/* ─── Empty state ───────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-3);
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  display: block;
  opacity: .7;
}
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.empty-sub { font-size: 13px; }

/* ─── Stats ─────────────────────────────────────────────── */
.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-num { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
.stat-lbl { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; }
.stat-sub { font-size: 11px; color: var(--text-3); }

/* ─── Chart ─────────────────────────────────────────────── */
.charts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.chart-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar-label { width: 90px; font-size: 11px; font-weight: 600; text-align: right; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.bar-track { flex: 1; background: var(--surface-2); border-radius: 6px; height: 22px; overflow: hidden; }
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent) 0%, #8b9cf8 100%);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
  min-width: 4px;
}
.bar-fill span { font-size: 10px; font-weight: 700; color: white; }
.bar-count { width: 24px; font-size: 11px; color: var(--text-2); text-align: right; font-weight: 600; flex-shrink: 0; }

/* ─── Settings ──────────────────────────────────────────── */
.field-def-list { display: flex; flex-direction: column; gap: 10px; }
.field-def-row {
  display: grid;
  grid-template-columns: 1fr 1.5fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 14px 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: box-shadow var(--transition);
}
.field-def-row:hover { box-shadow: var(--shadow); }
.field-def-input-wrap { display: flex; flex-direction: column; gap: 4px; }
.field-def-input-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }
.toggle-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.toggle-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }
.toggle { width: 36px; height: 20px; border-radius: 10px; background: #d1d5db; border: none; cursor: pointer; position: relative; transition: background var(--transition); flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; transition: transform var(--transition); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); }
.sep-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.sep-preview { font-family: 'Courier New', monospace; font-size: 13px; color: var(--accent); font-weight: 700; background: var(--accent-light); padding: 4px 10px; border-radius: 6px; }

/* ─── Modal ─────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 16px;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalIn .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.94); }
  to   { opacity: 1; transform: scale(1); }
}
.modal-header {
  padding: 22px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: var(--surface-2);
  border: none;
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  transition: all var(--transition);
}
.modal-close:hover { background: var(--border); color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 0 24px 20px; display: flex; gap: 8px; justify-content: flex-end; }
.modal-divider { height: 1px; background: var(--border); margin: 0 24px; }

.detail-name-box {
  background: linear-gradient(135deg, #f0f1ff, #f7f8fc);
  border: 1.5px solid #dde0fc;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  word-break: break-all;
  line-height: 1.6;
  margin-bottom: 16px;
}
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.detail-field { display: flex; flex-direction: column; gap: 3px; }
.detail-field-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); }
.detail-field-value { font-size: 13px; font-weight: 500; color: var(--text); }

/* ─── Toast ─────────────────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 28px; right: 28px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1f2937;
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translateX(20px);
  transition: all .25s cubic-bezier(.34,1.56,.64,1);
  min-width: 200px;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateX(0); }
.toast-icon { font-size: 16px; flex-shrink: 0; }

/* ─── Misc ──────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 20px 0; }
.info-box {
  background: #f0f4ff;
  border: 1px solid #c7d2fe;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 12px;
  color: #3730a3;
  margin-bottom: 16px;
  line-height: 1.6;
}
.copy-btn-inline {
  background: none; border: none; cursor: pointer;
  color: var(--accent); font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 5px;
  font-family: var(--font);
  transition: background var(--transition);
}
.copy-btn-inline:hover { background: var(--accent-light); }

/* Mobile hamburger */
.hamburger {
  display: none;
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-2);
  padding: 4px;
}
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 190; }

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main { margin-left: 0; }
  .hamburger { display: block; }
  .page-content { padding: 16px; }
  .cr-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .field-def-row { grid-template-columns: 1fr; }
  .charts-grid { grid-template-columns: 1fr; }
}

/* Color tokens for name preview */
.nt-0 { background: #eef0fe; color: #4655d4; }
.nt-1 { background: #ecfdf5; color: #065f46; }
.nt-2 { background: #fffbeb; color: #92400e; }
.nt-3 { background: #f5f3ff; color: #5b21b6; }
.nt-4 { background: #fff1f2; color: #9f1239; }
.nt-5 { background: #f0fdf4; color: #14532d; }
.nt-6 { background: #fef3c7; color: #78350f; }
</style>
</head>
<body>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- ─── Sidebar ─────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="white" stroke="white" stroke-width=".5"/></svg>
    </div>
    <div>
      <div class="logo-text">MetaCreative</div>
      <div class="logo-sub">命名管理システム</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">メニュー</div>
    <div class="nav-item active" onclick="showTab('new')" id="nav-new">
      <span class="nav-icon">✏️</span> 新規登録
    </div>
    <div class="nav-item" onclick="showTab('list')" id="nav-list">
      <span class="nav-icon">📋</span> 一覧
      <span class="nav-badge" id="nav-count">0</span>
    </div>
    <div class="nav-item" onclick="showTab('analytics')" id="nav-analytics">
      <span class="nav-icon">📊</span> 分析
    </div>

    <div class="sidebar-label" style="margin-top:20px">設定</div>
    <div class="nav-item" onclick="showTab('settings')" id="nav-settings">
      <span class="nav-icon">⚙️</span> 命名設定
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="nav-item" onclick="exportCSV()" style="font-size:12px">
      <span class="nav-icon">📥</span> CSV 出力
    </div>
  </div>
</aside>

<!-- ─── Main ────────────────────────────────────────── -->
<div class="main">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="topbar-title">新規登録</div>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" onclick="showTab('settings')">⚙️ 命名設定</button>
      <button class="btn btn-primary btn-sm" onclick="showTab('new')">＋ 新規登録</button>
    </div>
  </div>

  <div class="page-content">

    <!-- ── 新規登録 ── -->
    <div class="panel active" id="panel-new">
      <div class="card">
        <div class="card-title"><span class="ct-icon">✏️</span>クリエイティブ情報</div>
        <div class="fields-grid" id="form-fields"></div>

        <div class="name-preview-wrap">
          <div class="name-preview-label">⚡ 生成される命名</div>
          <div class="name-tokens" id="name-tokens">
            <span class="name-placeholder">フィールドを選択すると命名が生成されます</span>
          </div>
          <div style="margin-top:10px;display:flex;align-items:center;gap:8px">
            <code id="name-full" style="font-size:12px;color:var(--text-2);flex:1;word-break:break-all"></code>
            <button class="copy-btn-inline" onclick="copyPreviewName()">コピー</button>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
          <div class="field-block">
            <div class="field-label">メモ（任意）</div>
            <textarea id="field-memo" rows="2" placeholder="備考・狙いなど..."></textarea>
          </div>
          <div class="field-block">
            <div class="field-label">ステータス</div>
            <select id="field-status">
              <option value="draft">下書き</option>
              <option value="review">レビュー中</option>
              <option value="approved">承認済</option>
              <option value="active">配信中</option>
              <option value="paused">停止</option>
            </select>
          </div>
        </div>

        <div class="form-footer">
          <button class="btn btn-ghost" onclick="clearForm()">クリア</button>
          <div class="form-footer-right">
            <button class="btn btn-primary" onclick="saveCreative()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              登録する
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 一覧 ── -->
    <div class="panel" id="panel-list">
      <div class="filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="命名・メモで検索..." oninput="renderList()">
        </div>
        <div id="status-filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()">📥 CSV</button>
      </div>

      <div id="list-field-filters" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>

      <div id="cr-grid" class="cr-grid"></div>
      <div id="list-empty" class="empty-state" style="display:none">
        <span class="empty-icon">🔍</span>
        <div class="empty-title">見つかりません</div>
        <div class="empty-sub">検索条件を変えてみてください</div>
      </div>
    </div>

    <!-- ── 分析 ── -->
    <div class="panel" id="panel-analytics">
      <div class="stats-row" id="stats-row"></div>
      <div class="charts-grid" id="charts-grid"></div>
      <div id="analytics-empty" class="empty-state" style="display:none">
        <span class="empty-icon">📊</span>
        <div class="empty-title">データがありません</div>
        <div class="empty-sub">クリエイティブを登録すると分析が表示されます</div>
      </div>
    </div>

    <!-- ── 命名設定 ── -->
    <div class="panel" id="panel-settings">
      <div class="card">
        <div class="card-title"><span class="ct-icon">⚙️</span>フィールド定義</div>
        <div class="info-box">命名に含める項目、順番、選択肢を設定します。順番が命名の構成順になります。</div>
        <div class="field-def-list" id="field-defs"></div>
        <div style="margin-top:12px">
          <button class="btn btn-ghost btn-sm" onclick="addFieldDef()">＋ フィールドを追加</button>
        </div>

        <div class="divider"></div>

        <div class="card-title" style="margin-bottom:12px"><span class="ct-icon">🔗</span>区切り文字</div>
        <div class="sep-row">
          <span style="font-size:13px;color:var(--text-2)">フィールド間の区切り文字</span>
          <input type="text" id="sep-input" value="_" maxlength="3" style="width:70px;text-align:center;font-family:monospace;font-weight:700" oninput="updateSepPreview()">
          <div class="sep-preview" id="sep-preview">商品_ターゲット_フォーマット</div>
        </div>

        <div class="divider"></div>

        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" onclick="resetSettings()">デフォルトに戻す</button>
          <button class="btn btn-primary" onclick="saveSettings()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/></svg>
            設定を保存
          </button>
        </div>
      </div>
    </div>

  </div><!-- /page-content -->
</div><!-- /main -->

<!-- ─── Detail Modal ─────────────────────────────────── -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">クリエイティブ詳細</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-divider"></div>
    <div class="modal-footer">
      <button class="btn btn-danger-ghost btn-sm" id="modal-delete-btn">削除</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
'use strict';
// ══════════════════════════════════════════════════════
// Data & State
// ══════════════════════════════════════════════════════
const DEFAULT_FIELDS = [
  { id:'product', label:'商品/ブランド', required:true,  options:['SampleA','SampleB','SampleC'] },
  { id:'target',  label:'ターゲット',   required:true,  options:['20代女性','30代男性','全年齢','リタゲ'] },
  { id:'format',  label:'フォーマット', required:true,  options:['静止画','動画','カルーセル','ストーリーズ'] },
  { id:'concept', label:'コンセプト',   required:true,  options:['価格訴求','ブランド','機能訴求','口コミ'] },
  { id:'size',    label:'サイズ',       required:false, options:['1x1','4x5','9x16','16x9'] },
  { id:'version', label:'バージョン',   required:true,  options:['v1','v2','v3','v4','v5'] },
];
const TOKEN_COLORS = ['nt-0','nt-1','nt-2','nt-3','nt-4','nt-5','nt-6'];

let settings = loadSettings();
let creatives = loadCreatives();
let activeStatusFilter = '';

function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem('meta_cr_settings')||'null'); if(s) return s; } catch(e){}
  return { fields: JSON.parse(JSON.stringify(DEFAULT_FIELDS)), sep:'_' };
}
function loadCreatives() {
  try { return JSON.parse(localStorage.getItem('meta_cr_creatives')||'[]'); } catch(e){ return []; }
}
function persist() {
  localStorage.setItem('meta_cr_creatives', JSON.stringify(creatives));
  document.getElementById('nav-count').textContent = creatives.length;
}
function persistSettings() {
  localStorage.setItem('meta_cr_settings', JSON.stringify(settings));
}

// ══════════════════════════════════════════════════════
// Navigation
// ══════════════════════════════════════════════════════
const TAB_TITLES = { new:'新規登録', list:'一覧', analytics:'分析', settings:'命名設定' };

function showTab(name) {
  ['new','list','analytics','settings'].forEach(t => {
    document.getElementById('panel-'+t).classList.toggle('active', t === name);
    document.getElementById('nav-'+t)?.classList.toggle('active', t === name);
  });
  document.getElementById('topbar-title').textContent = TAB_TITLES[name] || '';
  if (name === 'list')      { buildStatusFilters(); buildFieldFilters(); renderList(); }
  if (name === 'analytics') renderAnalytics();
  if (name === 'settings')  renderSettingsForm();
  // close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

// ══════════════════════════════════════════════════════
// Form — chip selectors
// ══════════════════════════════════════════════════════
let formState = {};

function buildForm() {
  formState = {};
  const container = document.getElementById('form-fields');
  container.innerHTML = '';
  settings.fields.forEach(f => {
    formState[f.id] = '';
    const block = document.createElement('div');
    block.className = 'field-block';
    block.innerHTML = `
      <div class="field-label">
        ${esc(f.label)}
        ${f.required ? '<span class="required-dot">*</span>' : ''}
      </div>
      <div class="chip-group" id="chips-${f.id}"></div>
    `;
    container.appendChild(block);

    const group = block.querySelector('.chip-group');
    f.options.forEach(opt => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = opt;
      chip.addEventListener('click', () => {
        const already = formState[f.id] === opt;
        formState[f.id] = already ? '' : opt;
        group.querySelectorAll('.chip').forEach(c => {
          c.classList.toggle('selected', c.textContent === formState[f.id] && formState[f.id] !== '');
        });
        updateNamePreview();
      });
      group.appendChild(chip);
    });
  });
  updateNamePreview();
}

function updateNamePreview() {
  const parts = settings.fields.filter(f => formState[f.id]).map(f => ({ label:f.label, val:formState[f.id], idx: settings.fields.indexOf(f) }));
  const tokensEl = document.getElementById('name-tokens');
  const fullEl   = document.getElementById('name-full');

  if (!parts.length) {
    tokensEl.innerHTML = '<span class="name-placeholder">フィールドを選択すると命名が生成されます</span>';
    fullEl.textContent = '';
    return;
  }
  tokensEl.innerHTML = parts.map((p, i) =>
    `${i > 0 ? `<span class="name-sep">${esc(settings.sep)}</span>` : ''}` +
    `<span class="name-token ${TOKEN_COLORS[p.idx % TOKEN_COLORS.length]}">${esc(p.val)}</span>`
  ).join('');
  fullEl.textContent = buildName(formState);
}

function buildName(vals) {
  return settings.fields.filter(f => vals[f.id]).map(f => vals[f.id]).join(settings.sep);
}

function copyPreviewName() {
  const name = buildName(formState);
  if (!name) { toast('先にフィールドを選択してください', '⚠️'); return; }
  navigator.clipboard.writeText(name).then(() => toast('命名をコピーしました', '📋'));
}

function clearForm() {
  formState = {};
  settings.fields.forEach(f => formState[f.id] = '');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  document.getElementById('field-memo').value = '';
  document.getElementById('field-status').value = 'draft';
  updateNamePreview();
}

function saveCreative() {
  const missing = settings.fields.filter(f => f.required && !formState[f.id]);
  if (missing.length) {
    toast('必須項目: ' + missing.map(f => f.label).join(', '), '⚠️'); return;
  }
  const name = buildName(formState);
  const cr = {
    id: Date.now().toString(),
    name,
    fields: { ...formState },
    memo: document.getElementById('field-memo').value,
    status: document.getElementById('field-status').value,
    createdAt: new Date().toISOString(),
  };
  creatives.unshift(cr);
  persist();
  toast('登録しました！', '✅');
  clearForm();
}

// ══════════════════════════════════════════════════════
// List
// ══════════════════════════════════════════════════════
const STATUS_LABELS = { draft:'下書き', review:'レビュー中', approved:'承認済', active:'配信中', paused:'停止' };
const STATUS_CLASS  = { draft:'s-draft', review:'s-review', approved:'s-approved', active:'s-active', paused:'s-paused' };

let activeFieldFilter = { field:'', value:'' };

function buildStatusFilters() {
  const wrap = document.getElementById('status-filters');
  wrap.innerHTML = '';
  ['', ...Object.keys(STATUS_LABELS)].forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (activeStatusFilter === s ? ' active' : '');
    chip.textContent = s === '' ? 'すべて' : STATUS_LABELS[s];
    chip.onclick = () => {
      activeStatusFilter = s;
      buildStatusFilters();
      renderList();
    };
    wrap.appendChild(chip);
  });
}

function buildFieldFilters() {
  const wrap = document.getElementById('list-field-filters');
  wrap.innerHTML = '';
  settings.fields.forEach(f => {
    f.options.forEach(opt => {
      const chip = document.createElement('div');
      const isActive = activeFieldFilter.field === f.id && activeFieldFilter.value === opt;
      chip.className = 'filter-chip' + (isActive ? ' active' : '');
      chip.style.fontSize = '11px';
      chip.textContent = f.label + ': ' + opt;
      chip.onclick = () => {
        activeFieldFilter = isActive ? { field:'', value:'' } : { field:f.id, value:opt };
        buildFieldFilters();
        renderList();
      };
      wrap.appendChild(chip);
    });
  });
}

function getFiltered() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  return creatives.filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !(c.memo||'').toLowerCase().includes(q)) return false;
    if (activeStatusFilter && c.status !== activeStatusFilter) return false;
    if (activeFieldFilter.field && c.fields[activeFieldFilter.field] !== activeFieldFilter.value) return false;
    return true;
  });
}

function renderList() {
  const list = getFiltered();
  const grid = document.getElementById('cr-grid');
  const empty = document.getElementById('list-empty');
  grid.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';

  list.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cr-card';
    card.onclick = () => openDetail(c.id);
    const tags = settings.fields
      .filter(f => c.fields[f.id])
      .map(f => `<span class="cr-tag">${esc(c.fields[f.id])}</span>`)
      .join('');
    card.innerHTML = `
      <div class="cr-card-header">
        <div class="cr-name">${esc(c.name)}</div>
        <span class="status-badge ${STATUS_CLASS[c.status]||'s-draft'}">${STATUS_LABELS[c.status]||c.status}</span>
      </div>
      ${c.memo ? `<div style="font-size:11px;color:var(--text-2);margin-top:6px">${esc(c.memo)}</div>` : ''}
      <div class="cr-tags">${tags}</div>
      <div class="cr-footer">
        <span class="cr-date">${formatDate(c.createdAt)}</span>
        <button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();copyName('${esc(c.name)}')">コピー</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function copyName(name) {
  navigator.clipboard.writeText(name).then(() => toast('命名をコピーしました', '📋'));
}

// ══════════════════════════════════════════════════════
// Detail modal
// ══════════════════════════════════════════════════════
function openDetail(id) {
  const c = creatives.find(x => x.id === id);
  if (!c) return;

  document.getElementById('modal-body').innerHTML = `
    <div class="detail-name-box">${esc(c.name)}</div>
    <div class="detail-grid">
      ${settings.fields.map(f => `
        <div class="detail-field">
          <div class="detail-field-label">${esc(f.label)}</div>
          <div class="detail-field-value">${esc(c.fields[f.id]||'—')}</div>
        </div>
      `).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="detail-field">
        <div class="detail-field-label">ステータス</div>
        <div style="margin-top:4px"><span class="status-badge ${STATUS_CLASS[c.status]||'s-draft'}">${STATUS_LABELS[c.status]||c.status}</span></div>
      </div>
      <div class="detail-field">
        <div class="detail-field-label">登録日</div>
        <div class="detail-field-value">${formatDate(c.createdAt)}</div>
      </div>
    </div>
    ${c.memo ? `<div class="detail-field" style="margin-bottom:16px"><div class="detail-field-label">メモ</div><div class="detail-field-value" style="margin-top:4px">${esc(c.memo)}</div></div>` : ''}
    <div>
      <div class="detail-field-label" style="margin-bottom:6px">ステータス変更</div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="modal-status" style="flex:1">
          ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}"${c.status===v?' selected':''}>${l}</option>`).join('')}
        </select>
        <button class="btn btn-primary btn-sm" onclick="updateStatus('${c.id}')">更新</button>
        <button class="btn btn-ghost btn-sm" onclick="copyName('${esc(c.name)}')">コピー</button>
      </div>
    </div>
  `;
  document.getElementById('modal-delete-btn').onclick = () => deleteCreative(id);
  document.getElementById('detail-modal').classList.add('open');
}

function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }

function updateStatus(id) {
  const c = creatives.find(x => x.id === id);
  if (!c) return;
  c.status = document.getElementById('modal-status').value;
  persist();
  toast('ステータスを更新しました', '✅');
  closeModal();
  renderList();
}

function deleteCreative(id) {
  if (!confirm('このクリエイティブを削除しますか？')) return;
  creatives = creatives.filter(c => c.id !== id);
  persist();
  toast('削除しました', '🗑️');
  closeModal();
  renderList();
}

// ══════════════════════════════════════════════════════
// Analytics
// ══════════════════════════════════════════════════════
function renderAnalytics() {
  const total = creatives.length;
  const counts = {};
  Object.keys(STATUS_LABELS).forEach(k => counts[k] = 0);
  creatives.forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; });

  const emptyEl = document.getElementById('analytics-empty');
  emptyEl.style.display = total ? 'none' : 'block';

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-tile">
      <div class="stat-lbl">総クリエイティブ</div>
      <div class="stat-num" style="color:var(--accent)">${total}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-lbl">配信中</div>
      <div class="stat-num" style="color:var(--blue)">${counts.active}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-lbl">承認済</div>
      <div class="stat-num" style="color:var(--green)">${counts.approved}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-lbl">レビュー中</div>
      <div class="stat-num" style="color:var(--yellow)">${counts.review}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-lbl">下書き</div>
      <div class="stat-num" style="color:var(--text-3)">${counts.draft}</div>
    </div>
  `;

  if (!total) { document.getElementById('charts-grid').innerHTML = ''; return; }

  const grid = document.getElementById('charts-grid');
  grid.innerHTML = '';
  settings.fields.forEach((f, fi) => {
    const tally = {};
    creatives.forEach(c => { const v = c.fields[f.id]||'(未設定)'; tally[v]=(tally[v]||0)+1; });
    const sorted = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
    const max = sorted[0]?.[1] || 1;
    const card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = `<div class="chart-title">${esc(f.label)} 別</div>` +
      sorted.map(([lbl, n]) => `
        <div class="bar-row">
          <div class="bar-label" title="${esc(lbl)}">${esc(lbl)}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round(n/max*100)}%">
              ${n >= 2 ? `<span>${n}</span>` : ''}
            </div>
          </div>
          <div class="bar-count">${n}</div>
        </div>
      `).join('');
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════════════════════
// Settings
// ══════════════════════════════════════════════════════
function renderSettingsForm() {
  const list = document.getElementById('field-defs');
  list.innerHTML = '';
  settings.fields.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'field-def-row';
    row.innerHTML = `
      <div class="field-def-input-wrap">
        <div class="field-def-input-label">フィールド名</div>
        <input type="text" value="${esc(f.label)}" onchange="settings.fields[${i}].label=this.value">
      </div>
      <div class="field-def-input-wrap">
        <div class="field-def-input-label">選択肢（カンマ区切り）</div>
        <input type="text" value="${esc(f.options.join(','))}" onchange="settings.fields[${i}].options=this.value.split(',').map(s=>s.trim()).filter(Boolean)">
      </div>
      <div class="toggle-wrap">
        <div class="toggle-label">必須</div>
        <button class="toggle ${f.required?'on':''}" onclick="toggleRequired(${i}, this)" title="必須"></button>
      </div>
      <button class="btn btn-danger-ghost btn-xs" onclick="removeField(${i})" style="align-self:center">✕</button>
    `;
    list.appendChild(row);
  });
  document.getElementById('sep-input').value = settings.sep;
  updateSepPreview();
}

function toggleRequired(i, btn) {
  settings.fields[i].required = !settings.fields[i].required;
  btn.classList.toggle('on', settings.fields[i].required);
}

function addFieldDef() {
  settings.fields.push({ id:'field_'+Date.now(), label:'新フィールド', required:false, options:[] });
  renderSettingsForm();
}

function removeField(i) {
  if (settings.fields.length <= 1) { toast('最低1つのフィールドが必要です', '⚠️'); return; }
  settings.fields.splice(i, 1);
  renderSettingsForm();
}

function updateSepPreview() {
  const sep = document.getElementById('sep-input').value || '_';
  const sample = settings.fields.slice(0, 3).map(f => f.label);
  document.getElementById('sep-preview').textContent = sample.join(sep);
}

function saveSettings() {
  settings.sep = document.getElementById('sep-input').value || '_';
  persistSettings();
  buildForm();
  toast('設定を保存しました', '✅');
}

function resetSettings() {
  if (!confirm('デフォルト設定に戻しますか？')) return;
  settings = { fields: JSON.parse(JSON.stringify(DEFAULT_FIELDS)), sep:'_' };
  persistSettings();
  renderSettingsForm();
  buildForm();
  toast('デフォルトに戻しました', '🔄');
}

// ══════════════════════════════════════════════════════
// CSV
// ══════════════════════════════════════════════════════
function exportCSV() {
  if (!creatives.length) { toast('データがありません', '⚠️'); return; }
  const headers = ['命名', ...settings.fields.map(f => f.label), 'ステータス', 'メモ', '登録日'];
  const rows = creatives.map(c => [
    c.name,
    ...settings.fields.map(f => c.fields[f.id]||''),
    STATUS_LABELS[c.status]||c.status,
    c.memo||'',
    formatDate(c.createdAt),
  ]);
  const csv = [headers,...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'meta_creatives_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('CSVを出力しました', '📥');
}

// ══════════════════════════════════════════════════════
// Utilities
// ══════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

let toastTimer = null;
function toast(msg, icon='ℹ️') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="toast-icon">${icon}</span>${esc(msg)}`;
  container.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => { el.classList.add('show'); }); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

// Modal close on overlay click
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ══════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════
buildForm();
document.getElementById('nav-count').textContent = creatives.length;
</script>
